<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Nocrutack | Cybersecurity Lab</title>
    
    <link rel="icon" type="image/png" href="OD.png">
    
    <style>
        /* RESETEO: Quita márgenes por defecto del navegador */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* BODY: Fondo negro, ocupa toda la pantalla y centra la terminal */
        body {
            background-color: #0d0d0d; 
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center; /* Centra horizontalmente */
            align-items: center;     /* Centra verticalmente */
            font-family: 'SF Mono', 'Monaco', monospace;
            overflow: hidden;        /* Evita barras de scroll en el fondo */
        }

        /* CANVAS: El lienzo donde se dibuja la lluvia de Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1; /* Se queda al fondo */
        }

        /* TERMINAL: El contenedor principal estilo ventana de Mac */
        .terminal {
            background: #000;
            width: 90%;
            max-width: 800px; 
            height: 480px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column; /* Apila la barra gris sobre el texto negro */
            position: relative;
            overflow: hidden;
            z-index: 10; /* Se pone por delante del Matrix */
        }

        /* RESPONSIVIDAD: Agranda la terminal solo si es una PC (pantalla grande) */
        @media screen and (min-width: 1024px) {
            .terminal {
                max-width: 1100px;
                height: 650px;
            }
        }

        /* HEADER: La barra gris superior con los botones */
        .header {
            background: #2d2d2d;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: relative;
            flex-shrink: 0; /* Evita que la barra se encoja */
        }

        /* BOTONES: Círculos de colores estilo macOS */
        .buttons { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        /* TÍTULO: Texto centrado en la barra gris */
        .title {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #999;
            font-size: 13px;
            left: 0;
            pointer-events: none; /* Ignora clics para no molestar */
        }

        /* CONTENT: Zona donde aparece el texto verde de la consola */
        .content {
            padding: 20px;
            font-size: 16px;
            color: #00ff41; /* Verde neón */
            overflow-y: auto; /* Permite scroll si hay mucho texto */
            flex-grow: 1;    /* Ocupa todo el espacio disponible */
            line-height: 1.4;
        }

        /* PROMPT: El texto 'nocrutack@lab:~$' en azul */
        .prompt { color: #0087ff; font-weight: bold; margin-right: 8px; }
        
        /* LÍNEA DE ENTRADA: Alinea el prompt con lo que escribes */
        #input-line { display: flex; align-items: center; }

        /* INPUT: El cuadro de escritura real está oculto (invisible) */
        #user-input {
            background: transparent;
            border: none;
            color: transparent;
            outline: none;
            width: 1px;
            position: absolute;
        }

        /* DISPLAY TEXT: Lo que el usuario ve que está escribiendo */
        #display-text { color: #00ff41; white-space: pre-wrap; }

        /* CURSOR: El guion parpadeante _ */
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="terminal" onclick="document.getElementById('user-input').focus();">
        
        <div class="header">
            <div class="buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="title">nocrutack — bash — 80x24</span>
        </div>

        <div class="content">
            <p id="typing-text"></p>
            
            <div id="input-line" style="display: none;">
                <span class="prompt">nocrutack@lab:~$</span>
                <span id="display-text"></span><span class="blink">_</span>
                <input type="text" id="user-input" autofocus autocomplete="off" maxlength="15">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
