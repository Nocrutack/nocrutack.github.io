<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Nocrutack | Cybersecurity Lab</title>
    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>

    <div class="terminal" onclick="document.getElementById('user-input').focus();">
        <div class="header">
            <div class="buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="title">nocrutack — bash — 80x24</span>
        </div>

        <div class="content">
            <p id="typing-text"></p>
            
            <div id="input-line" style="display: none;">
                <span class="prompt">nocrutack@lab:~$</span>
                <span id="display-text"></span><span class="blink">_</span>
                <input type="text" id="user-input" autofocus autocomplete="off" 
                       autocapitalize="none" spellcheck="false" enterkeyhint="done">
            </div>
        </div>
    </div>

    <div id="monitor" style="display: none;">
        <div class="monitor-frame">
            <div class="monitor-screen">
                <nav class="monitor-nav" style="display: flex; justify-content: space-between; padding: 10px; background: #333; color: white;">
                    <span id="monitor-title">Explorador de Archivos</span>
                    <button id="back-btn" onclick="closeMonitor()" style="cursor:pointer; background: #ff5f56; border: none; color: white; border-radius: 5px; padding: 5px 10px;">✖ VOLVER</button>
                </nav>
                <div id="monitor-body" style="padding: 20px; overflow-y: auto;">
                    </div>
            </div>
            <div class="monitor-base"></div>
        </div>
    </div>

    <script src="script.js?v=5.0"></script>
</body>
</html>
