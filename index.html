<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Nocrutack | Cybersecurity Lab</title>
    
    <link rel="icon" type="image/png" href="OD.png">
    
    <style>
        /* --- VARIABLES DE COLOR --- */
        /* Definimos los colores base (Modo Oscuro por defecto) */
        :root {
            --bg-color: #0d0d0d;      /* Fondo de la página */
            --terminal-bg: #000;      /* Fondo de la terminal */
            --text-color: #00ff41;    /* Color del texto (verde Matrix) */
            --header-bg: #2d2d2d;    /* Barra superior gris */
            --prompt-color: #0087ff;  /* Color azul del usuario */
            --canvas-opacity: 1;      /* Visibilidad del fondo Matrix */
        }

        /* Colores que se activarán cuando la página tenga el atributo 'light' */
        [data-theme="light"] {
            --bg-color: #e5e5e5;      /* Gris claro estilo Apple */
            --terminal-bg: #ffffff;   /* Terminal blanca */
            --text-color: #1d1d1f;    /* Texto negro profundo */
            --header-bg: #d1d1d6;    /* Barra superior gris plata */
            --prompt-color: #005bb7;  /* Azul más oscuro para contraste */
            --canvas-opacity: 0.15;   /* Matrix casi invisible para que no moleste */
        }

        /* RESETEO: Quita márgenes por defecto del navegador */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* BODY: Ahora usa la variable --bg-color con una transición suave de 0.3s */
        body {
            background-color: var(--bg-color); 
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'SF Mono', 'Monaco', monospace;
            overflow: hidden;
            transition: background-color 0.3s ease; 
        }

        /* CANVAS: Opacidad variable para que no moleste en el modo claro */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            opacity: var(--canvas-opacity);
            transition: opacity 0.3s ease;
        }

        /* TERMINAL: Ahora usa la variable --terminal-bg */
        .terminal {
            background: var(--terminal-bg);
            width: 90%;
            max-width: 800px; 
            height: 480px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            z-index: 10;
            transition: background-color 0.3s ease;
        }

        /* RESPONSIVIDAD PC */
        @media screen and (min-width: 1024px) {
            .terminal { max-width: 1100px; height: 650px; }
        }

        /* HEADER: Usa la variable --header-bg */
        .header {
            background: var(--header-bg);
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: relative;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .buttons { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .title {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #999;
            font-size: 13px;
            left: 0;
            pointer-events: none;
        }

        /* BOTÓN DE MODO: Estilo minimalista en la esquina derecha del header */
        #theme-toggle {
            position: absolute;
            right: 15px;
            background: #444;
            color: white;
            border: none;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 10px;
            cursor: pointer;
            z-index: 20;
            font-weight: bold;
        }

        /* CONTENT: Usa la variable --text-color */
        .content {
            padding: 20px;
            font-size: 16px;
            color: var(--text-color);
            overflow-y: auto;
            flex-grow: 1;
            line-height: 1.4;
            transition: color 0.3s ease;
        }

        /* PROMPT: Usa la variable --prompt-color */
        .prompt { color: var(--prompt-color); font-weight: bold; margin-right: 8px; }
        
        #input-line { display: flex; align-items: center; }

        #user-input {
            background: transparent;
            border: none;
            color: transparent;
            outline: none;
            width: 1px;
            position: absolute;
        }

        /* DISPLAY TEXT: Se adapta al color del tema automáticamente */
        #display-text { color: var(--text-color); white-space: pre-wrap; }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="terminal" onclick="document.getElementById('user-input').focus();">
        
        <div class="header">
            <div class="buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span class="title">nocrutack — bash — 80x24</span>
            
            <button id="theme-toggle">MODO CLARO</button>
        </div>

        <div class="content">
            <p id="typing-text"></p>
            
            <div id="input-line" style="display: none;">
                <span class="prompt">nocrutack@lab:~$</span>
                <span id="display-text"></span><span class="blink">_</span>
                <input type="text" id="user-input" autofocus autocomplete="off" maxlength="15">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        const btn = document.getElementById('theme-toggle');
        btn.addEventListener('click', () => {
            // Revisa si el tema actual es 'light'
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            // Intercambia el atributo
            document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
            // Cambia el texto del botón
            btn.innerText = isLight ? 'MODO CLARO' : 'MODO OSCURO';
        });
    </script>
</body>
</html>
