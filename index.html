<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocrutack | Cybersecurity Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="terminal" onclick="document.getElementById('user-input').focus();">
        <div class="header">
            <span class="buttons">● ● ●</span>
            <span class="title">nocrutack@github: ~</span>
        </div>

        <div class="content">
            <p id="typing-text"></p>
            
            <div id="input-line" style="display: none;">
                <span class="prompt">nocrutack@lab:~$</span>
                <span id="display-text"></span><span class="blink">_</span>
                <input type="text" id="user-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>

    <div id="monitor" style="display: none;">
        <div class="monitor-frame">
            <div class="monitor-screen">
                <nav class="monitor-nav">
                    <span id="monitor-title">Explorador de Archivos</span>
                    <button id="back-btn" onclick="closeMonitor()">✖ VOLVER A TERMINAL</button>
                </nav>
                <div id="monitor-body">
                    </div>
            </div>
            <div class="monitor-base"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
